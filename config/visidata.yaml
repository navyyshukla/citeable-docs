project:
  name: VisiData
  slug: visidata
  upstream_repo: saulpw/visidata
  ref: stable
  docs_path: docs
  site_base_url: https://www.visidata.org/docs
  license_note: "Unofficial. Answers are generated from VisiData's documentation; VisiData is licensed GPLv3."
  issues_url: https://github.com/saulpw/visidata/issues
  skip_files:
    - README.md
  max_piece_chars: 1500
search:
  top_k: 5
  rrf_k: 60
  evidence_threshold: 0.02
  vector_index: none
limits:
  max_question_chars: 500
  max_answer_tokens: 400
  max_completion_tokens: 3000
  max_completion_tokens_no_thinking: 1000
  global_daily_cap: 150
  per_visitor_daily_cap: 10
  global_daily_neurons: 8000
  retention_days: 30
models:
  embedding: "@cf/baai/bge-base-en-v1.5"
  embedding_dim: 768
  embedding_batch: 20
  answer_order:
    - "cloudflare:@cf/google/gemma-4-26b-a4b-it"
    - "groq:openai/gpt-oss-20b"
    - "cloudflare:@cf/meta/llama-3.1-8b-instruct-fp8"
  # Cloudflare neurons per million tokens: [input, output]. Groq is not billed in neurons.
  neurons_per_m_tokens:
    "@cf/google/gemma-4-26b-a4b-it": [9091, 27273]
    "@cf/meta/llama-3.1-8b-instruct-fp8": [13778, 26128]
  # Thinking off for gemma: 57% cheaper, 5x faster (spike S10, D17). Re-check on the Task 15 dev set.
  thinking:
    "@cf/google/gemma-4-26b-a4b-it": false
  non_reasoning:
    - "@cf/meta/llama-3.1-8b-instruct-fp8"
api:
  cors_origins:
    - https://navyyshukla.github.io
site:
  url: https://navyyshukla.github.io/citeable-docs/
  api_base_url: https://citeable-docs-api.onrender.com
  title: Ask the VisiData docs
  intro: >-
    VisiData is a free tool that runs in the terminal and works like a spreadsheet for data
    files such as CSV. You drive it with the keyboard and can explore a file quickly. Ask
    anything about using it; answers come only from its documentation, with links.
  starter_questions:
    - How do I rename a column?
    - How can I convert a CSV file to another file type?
    - How do I make a frequency table of a column?
    - What does the ! key do to a column?
  privacy_notice: >-
    Your question and the answer are kept for 30 days, then deleted. Only the owner reads
    questions. To answer, the text of your question is sent to Cloudflare and Groq (the AI
    models), and the service runs on Render with its data in Neon.
  known_wrong:
    d-001: >-
      The docs' sort page and VisiData's source code disagree on which of [ and ] sorts
      high-to-low. The answer repeats what the docs say.
    k-004: The docs excerpt on this topic is too vague to give a helpful answer.
