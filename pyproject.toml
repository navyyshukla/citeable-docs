[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citeable-docs"
version = "0.1.0"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[tool.setuptools.packages.find]
include = ["app*", "ingest*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["spikes"]

[tool.ruff.lint]
# explicit, so a new ruff release cannot switch on rules and break CI
select = ["E4", "E7", "E9", "F", "RUF015", "FURB167"]
