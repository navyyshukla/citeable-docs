name: real-docs
# Runs the tests that need the real VisiData docs. The docs are public and are only downloaded
# for the test run; nothing is committed. Weekly, and on demand.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
jobs:
  real-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mkdir -p spikes/.cache && curl -fsSL https://codeload.github.com/saulpw/visidata/tar.gz/stable -o spikes/.cache/stable.tar.gz
      - run: pytest -q -rs
