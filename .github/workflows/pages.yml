name: pages
# Publishes the static chat page and the /evals page to GitHub Pages. No secrets: the page is
# built from config/visidata.yaml and site/ only, and holds no token (invite links carry it).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "config/visidata.yaml"
      - "scripts/build_site.py"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python scripts/build_site.py page --out _site
      - run: if [ -d site/public ]; then cp -R site/public/. _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
